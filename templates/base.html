{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}CareerMatch{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="logo">
        Career<span>Match</span>
    </div>

    <div class="nav-links">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'skill_compass' %}">Skill Compass</a>
        <a href="{% url 'my_invites' %}">Invites</a>
    </div>

    <div class="nav-actions">
        <a class="logout-btn" href="{% url 'logout' %}">Logout</a>
    </div>

</nav>


<!-- PAGE CONTENT -->
<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
